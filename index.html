<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>sketch</title>
   <style>
    body{
    background-color: red;
    }
    </style>
    <style>
     #sqaure{
        height: 200px;
        width: 200px;
        position: absolute;
        background: gold;
        box-shadow: 14px 12px black;
      }
    </style>
  </head>
  <body>
    <div id="sqaure">
    </div>
    <script>
    let nameObj = "sqaure" ///string global var
    let speed = 10; //number global var
    let moving = true; // boolean global var
      
      let x = 150;
      let y = 150;
      let dx = speed;
      let dy = speed;
      
    function moveSqaure(){
    if(moving){
      x += dx;
      y += dy;
      if( x > window.innerWidth- 200 || x < 2){
        dx = -dx;
      }
      if (y > window.innerHeight - 200 || y < 2){
        dy = -dy;
      }
      
      sqaure.style.left = x + "px";
      sqaure.style.top = y + "px";
    }
      }
      function showInfo(){
        console.log(nameObj, speed, moving);
      }
      showInfo();
      setInterval(moveSqaure,10);
    </script>
  </body>
</html>
